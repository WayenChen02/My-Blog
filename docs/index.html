<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css">
  <link rel="stylesheet" href="./_media/blog.css">
  <style>
    :root {
      --cover-bg: none;
      --cover-bg-overlay: rgba(255, 255, 255, 0.08);
      --cover-color: #34495e;
      --cover-title-color: #284b3a;
    }
    /* 在本页面解析图片相对路径，避免路径落到 CDN 的主题目录。 */
    .cover {
      background: #eef4e9 url('./_media/blog-cover.png') center center / cover no-repeat;
    }
  </style>
</head>
<body>
  <nav>
    <a href="#/zh-en">EN</a>
    <a href="#/zh-cn">中文</a>
  </nav>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: "WayenChen's Blog",
      repo: 'https://github.com/aiheidabuzhao/My-Blog',
      loadSidebar:true,
      loadNavbar:true,
      subMaxLevel: 2,
      onlyCover:true,
      coverpage:true,
      alias: {
        '/#/.*/_sidebar.md': '/_sidebar.md',
        '/zh-cn/.*/_sidebar.md': '/zh-cn/_sidebar.md'
      }
    }
  </script>
  <script src="./_media/rag-sidebar.js"></script>
  <!-- Docsify v5 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
</body>
</html>
